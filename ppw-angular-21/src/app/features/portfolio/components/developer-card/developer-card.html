<a [routerLink]="['/programadores', developer().slug]" class="card bg-base-100 border border-base-300 shadow">
  <div class="card-body items-center text-center">
    <div class="avatar">
      <div class="w-24 rounded-full">
        <img [src]="developer().photoUrl" [alt]="developer().fullName" />
      </div>
    </div>
    <h3 class="card-title">{{ developer().fullName }}</h3>
    <span class="badge badge-primary">{{ developer().role }}</span>
    <p class="text-sm">{{ developer().shortBio }}</p>
    <div class="card-actions">
      <span class="link link-primary text-sm">Ver perfil</span>
    </div>
  </div>
</a>
