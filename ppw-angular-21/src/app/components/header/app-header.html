<header class="flex items-center justify-between bg-slate-900 px-6 py-4 text-white">

  <span class="text-xl font-bold tracking-wide">{{ brand() | uppercase }}</span>

  <nav class="flex gap-6">
    <a class="text-sm text-slate-300 hover:text-white border-b-2 border-transparent pb-0.5 transition-colors duration-200"
       routerLink="/"
       routerLinkActive="!border-red-500 !text-white font-semibold"
       [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </a>

    <a class="text-sm text-slate-300 hover:text-white border-b-2 border-transparent pb-0.5 transition-colors duration-200"
       routerLink="/students"
       routerLinkActive="!border-red-500 !text-white font-semibold">
      Estudiantes
    </a>

    <a class="text-sm text-slate-300 hover:text-white border-b-2 border-transparent pb-0.5 transition-colors duration-200"
       routerLink="/layouts"
       routerLinkActive="!border-red-500 !text-white font-semibold">
      Layouts
    </a>

    <a class="text-sm text-slate-300 hover:text-white border-b-2 border-transparent pb-0.5 transition-colors duration-200"
       routerLink="/signup"
       routerLinkActive="!border-red-500 !text-white font-semibold">
      Registrarse
    </a>

    <a class="text-sm text-slate-300 hover:text-white border-b-2 border-transparent pb-0.5 transition-colors duration-200"
       routerLink="/profile"
       routerLinkActive="!border-red-500 !text-white font-semibold">
      Perfil
    </a>

    <a class="text-sm text-slate-300 hover:text-white border-b-2 border-transparent pb-0.5 transition-colors duration-200"
       routerLink="/project-config"
       routerLinkActive="!border-red-500 !text-white font-semibold">
      Proyecto
    </a>
  </nav>

</header>
